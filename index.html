<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 💡 ブラウザのタブに表示される名前を変更しました -->
    <title>Easy.pyホームページ</title>
    <style>
        /* 全体のダークモードデザイン */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: sans-serif;
            margin: 0;
            padding: 20px 20px 0 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            flex: 1;
        }
        /* 💡 サイト最上部のタイトルデザイン */
        .site-header {
            text-align: left;
            margin-bottom: 25px;
            width: 100%;
        }
        .site-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .site-desc {
            color: #8b949e;
            font-size: 13px;
            margin: 0;
        }
        /* タグ */
        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tag {
            background-color: #1f242c;
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 12px;
            color: #8b949e;
        }
        /* ミニIDE全体の枠 */
        .ide-box {
            background-color: #12161f;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .ide-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }
        .ide-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }
        .ide-subtitle {
            color: #8b949e;
            font-size: 11px;
        }
        /* エディタ */
        textarea {
            width: 100%;
            height: 120px;
            background-color: #05070a;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 13px;
            line-height: 1.5;
        }
        /* ボタン */
        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .btn-run {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-reset {
            background-color: transparent;
            color: #8b949e;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 6px 15px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-hint {
            color: #8b949e;
            font-size: 11px;
            flex: 1;
        }
        /* 出力エリア */
        .output-box {
            background-color: #05070a;
            border: 1px solid #30363d;
            border-radius: 6px;
            min-height: 80px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            color: #58a6ff;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        /* リンクエリアの枠 */
        .link-box {
            background-color: #12161f;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }
        .link-item {
            margin-bottom: 15px;
        }
        .link-item-title {
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .link-item-desc {
            color: #8b949e;
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
        }
        /* 丸いリンクボタン */
        .link-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-outline {
            background-color: transparent;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }
        /* フッター */
        footer {
            width: 100%;
            max-width: 500px;
            border-top: 1px solid #21262d;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8b949e;
            margin-top: auto;
        }
        footer a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 💡 サイトのタイトルエリア -->
        <div class="site-header">
            <h1 class="site-title">Easy.pyホームページ</h1>
            <p class="site-desc">Easy's official website</p>
        </div>

        <!-- 🏷️ タグ -->
        <div class="tags">
            <div class="tag">Python</div>
            <div class="tag">Easy.py</div>
            <div class="tag">自作ページ</div>
        </div>

        <!-- 💻 ミニIDE -->
        <div class="ide-box">
            <div class="ide-header">
                <div class="ide-title">ミニIDE</div>
                <div class="ide-subtitle">ブラウザ上で試せる簡易実行環境</div>
            </div>
            <!-- 💡 初期コードの中身もPython風に変更しました -->
            <textarea id="codeEditor">name = "Explorer"

print(f"Hello, {name}!")
print("Easy.pyホームページへ ようこそ！")</textarea>
            <div class="btn-group">
                <button class="btn-run" onclick="runCode()">実行</button>
                <button class="btn-reset" onclick="resetCode()">リセット</button>
                <div class="btn-hint">上の文字を書き換えて実行できます</div>
            </div>
            <div id="outputArea" class="output-box">ここに結果が表示されます</div>
        </div>

        <!-- 🔗 リンクエリア -->
        <div class="link-box">
            <div class="link-header">
                <div class="ide-title">リンク</div>
                <div class="ide-subtitle">外部の関連ページなど</div>
            </div>
            
            <div class="link-item">
                <div class="link-item-title">GitHub: mito-easy</div>
                <p class="link-item-desc">Easy.pyのソースコードやプロジェクトを公開している保管庫です。</p>
            </div>

            <div class="link-buttons">
                <a href="https://github.com" class="btn-outline">GitHub: @mito-easy</a>
            </div>
        </div>
    </div>

    <!-- 👣 フッター -->
    <footer>
        <div>&copy; 2026 Easy.py / mito-easy</div>
        <div>
            <a href="https://github.com">GitHub</a>
        </div>
    </footer>

    <!-- 🛠️ JavaScriptの仕組み（Pythonのprintに対応） -->
    <script>
        const defaultCode = `name = "Explorer"\n\nprint(f"Hello, {name}!")\nprint("Easy.pyホームページへ ようこそ！")`;
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const outputArea = document.getElementById('outputArea');
            outputArea.innerText = '';
            let name = "Explorer";
            const lines = code.split('\n');
            let result = [];
            
            lines.forEach(line => {
                // 変数代入の読み取り (name = "xxx")
                const varMatch = line.match(/name\s*=\s*"([^"]+)"/);
                if (varMatch) { name = varMatch[1]; }
                
                // print文の読み取り
                const printMatch = line.match(/print\(\s*f?"([^"]+)"\s*\)/);
                if (printMatch) {
                    let text = printMatch[1];
                    text = text.replace('{name}', name);
                    result.push(text);
                }
            });
            outputArea.innerText = result.length === 0 ? "出力はありません（print(\"文字\") の形式で書いてね）" : result.join('\n');
        }
        function resetCode() {
            document.getElementById('codeEditor').value = defaultCode;
            document.getElementById('outputArea').innerText = 'リセットしました。実行ボタンを押してください。';
        }
    </script>

</body>
</html>
